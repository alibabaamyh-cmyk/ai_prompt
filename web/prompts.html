<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt 庫 - AI Prompt 集合平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="back-link">← 返回首頁</a>
      <h1 class="logo">🎯 Prompt 庫</h1>
      <p class="tagline">瀏覽、複製、使用所有可用的 AI Prompt</p>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <h2>篩選 Prompt</h2>
      <div class="filter-group">
        <label for="type-filter">按類型：</label>
        <select id="type-filter" class="filter-select">
          <option value="">所有類型</option>
          <option value="shop-positioning">旺舖定位</option>
          <option value="product-detail">商品詳情頁</option>
          <option value="product-image">產品主圖</option>
          <option value="data-structuring">資料結構化</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="scenario-filter">按商家類型：</label>
        <select id="scenario-filter" class="filter-select">
          <option value="">所有場景</option>
          <option value="brand-owner">品牌商家</option>
          <option value="factory-manufacturer">工廠/製造商</option>
          <option value="trader-agent">貿易商/代理商</option>
          <option value="sme-owner">中小企業主</option>
          <option value="individual-seller">個人賣家</option>
          <option value="universal">通用版本</option>
        </select>
      </div>
    </section>

    <section id="prompts-grid" class="prompts-grid">
      <!-- 動態加載 Prompt 卡片 -->
    </section>
  </main>

  <!-- Prompt 詳情 Modal -->
  <div id="prompt-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closePromptModal()">×</button>

      <h2 id="modal-title"></h2>
      <p id="modal-description" class="text-muted"></p>

      <div class="modal-body">
        <div id="modal-template" class="prompt-template"></div>
      </div>

      <div class="modal-footer">
        <button class="btn" onclick="copyPromptToClipboard()">📋 複製到剪貼板</button>
        <button class="btn secondary" onclick="closePromptModal()">關閉</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Amy Studio 阿里巴巴專案組</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/prompts.js"></script>
</body>
</html>
