<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>場景詳情 - AI Prompt 集合平台</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首頁</a>
      <h1 class="logo">🎯 AI Prompt 集合平台</h1>
    </div>
  </header>

  <main class="container">
    <section id="scenario-detail" class="scenario-detail">
      <!-- 動態加載場景詳情 -->
    </section>

    <section id="form-section" class="form-section">
      <h2>請填入你的商家信息</h2>
      <form id="scenario-form" class="form">
        <!-- 動態生成表單 -->
      </form>
      <button id="generate-btn" class="btn btn-large">生成 Prompt</button>
    </section>

    <section id="result-section" class="result-section" style="display: none;">
      <h2>你的定制化 Prompt</h2>
      <div id="result-container" class="prompt-result">
        <!-- 生成的 Prompt 會顯示在這裡 -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Amy Studio 阿里巴巴專案組</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/scenario.js"></script>
</body>
</html>
